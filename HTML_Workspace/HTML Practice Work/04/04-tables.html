<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Course Table Example</title>
</head>
<body>
  <h1>Course scores (example)</h1>
  <table border="1" cellpadding="6" cellspacing="0">
    <thead>
      <tr>
        <th>Sr. No.</th>
        <th>Course Code</th>
        <th>Course Name</th>
        <th>Credit Hours</th>
        <th>Mid</th>
        <th>Practical</th>
        <th>Sessional</th>
        <th>Final</th>
        <th>Score</th>
        <th>Grade</th>
        <th>Grade Point</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <th scope="row">1</th>
        <td>COMP1112</td>
        <td>Programming Fundamentals</td>
        <td>4</td>
        <td>16.00</td>
        <td>-</td>
        <td>-</td>
        <td>-</td>
        <td>-</td>
        <td>-</td>
        <td>-</td>
        <td><button type="button">Dispute</button></td>
      </tr>
      <tr>
        <th scope="row">2</th>
        <td>ENGL1114</td>
        <td>Functional English</td>
        <td>3</td>
        <td>-</td>
        <td>-</td>
        <td>-</td>
        <td>-</td>
        <td>-</td>
        <td>-</td>
        <td>-</td>
        <td><button type="button">Dispute</button></td>
      </tr>
      <!-- Additional rows omitted for brevity -->
      <tr>
        <td colspan="3"><strong>Total Courses</strong></td>
        <td colspan="2">6</td>
        <td colspan="3"><strong>Credits Earned</strong></td>
        <td colspan="3">-</td>
      </tr>
    </tbody>
  </table>
</body>
</html>
