<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Other HTML Tags</title>
</head>
<body>
  <h1>Other useful HTML tags</h1>

  <address>Hafizabad, Punjab, Pakistan</address>

  <p><button type="button">Click Here</button></p>

  <pre><code>
Example code block
Line 2 of code
  Indented line
  </code></pre>

  <div>
    Example div with some placeholder text to show block-level content.
  </div>

  <p>
    <label for="example-select">Choose:</label>
    <select id="example-select">
      <optgroup label="Group A">
        <option value="1">Option 1</option>
      </optgroup>
    </select>
  </p>

  <p>
    <label for="example-textarea">Notes:</label><br>
    <textarea id="example-textarea" cols="30" rows="4"></textarea>
  </p>

  <details>
    <summary>More details</summary>
    Hidden content shown when expanded.
  </details>

  <audio controls>
    <source src="" type="audio/mpeg">
    Your browser does not support the audio element.
  </audio>
</body>
</html>
