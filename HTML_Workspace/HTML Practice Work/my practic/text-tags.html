<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Text Tags Practice</title>
</head>
<body>
  <h1>Text Tags: b, i, br, hr, sub, sup</h1>
  <p>
    <i>Italic text</i> and <b>bold text</b> with a line break below:<br>
    After the break text continues.
  </p>
  <p>
    Subscript example: H<sub>2</sub>O, Superscript example: x<sup>2</sup>
  </p>
  <hr>
  <p>Use these tags to emphasize and structure inline text.</p>
</body>
</html>
