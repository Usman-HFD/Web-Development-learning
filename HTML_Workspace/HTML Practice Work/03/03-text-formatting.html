<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Text Formatting Examples</title>
</head>
<body>
  <h1>Text formatting tags</h1>

  <p>
    This <i>is</i> an example of italic text and this is <b>bold</b> text. You can also combine
    tags: <b><i>bold and italic</i></b>.
  </p>

  <p>
    Line breaks are created with <code>&lt;br&gt;</code> and horizontal rules with <code>&lt;hr&gt;</code>.
  </p>

  <p>
    Chemical example: H<sub>2</sub>O and exponents 2<sup>2</sup>.
  </p>

  <p>
    Use <mark>mark</mark> to highlight text.
  </p>
</body>
</html>
